name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [f401, g491]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Cache STM32Cube Toolchain Bundles
        id: cache-stm32cube
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/stm32cube
            ~/.stm32cube
            ~/.local/share/stm32cube
          key: stm32cube-bundles-${{ runner.os }}-${{ hashFiles('.settings/bundles-lock.store.json') }}
          restore-keys: |
            stm32cube-bundles-${{ runner.os }}-

      - name: Install STM32CubeCLI and Toolchain Bundles
        run: |
          curl -fsSL https://developer.st.com/bundles/install/install.sh | bash -
          export PATH="$HOME/.local/stm32cube/bin:$PATH"
          echo "$HOME/.local/stm32cube/bin" >> $GITHUB_PATH

          cube bundle install --project --yes

          # Dynamically export discovered toolchain paths (no hardcoded versions)
          for tool_bin in $(find "$HOME/.local/stm32cube" "$HOME/.stm32cube" "$HOME/.local/share/stm32cube" -type d -name "bin" 2>/dev/null); do
            echo "$tool_bin" >> $GITHUB_PATH
          done

      - name: Build Firmware
        run: |
          just target=${{ matrix.board }} build_type=Debug build
          just target=${{ matrix.board }} size

      - name: Upload F401 Firmware Binary for Emulation
        if: matrix.board == 'f401'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-f401
          path: build/STM32F401RE-Debug/lab-calculator.elf
          if-no-files-found: error

  lint:
    name: Lint (All Boards)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Cache STM32Cube Toolchain Bundles
        id: cache-stm32cube
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/stm32cube
            ~/.stm32cube
            ~/.local/share/stm32cube
          key: stm32cube-bundles-${{ runner.os }}-${{ hashFiles('.settings/bundles-lock.store.json') }}
          restore-keys: |
            stm32cube-bundles-${{ runner.os }}-

      - name: Install STM32CubeCLI and Toolchain Bundles
        run: |
          curl -fsSL https://developer.st.com/bundles/install/install.sh | bash -
          export PATH="$HOME/.local/stm32cube/bin:$PATH"
          echo "$HOME/.local/stm32cube/bin" >> $GITHUB_PATH

          cube bundle install --project --yes

          # Dynamically export discovered toolchain paths (no hardcoded versions)
          for tool_bin in $(find "$HOME/.local/stm32cube" "$HOME/.stm32cube" "$HOME/.local/share/stm32cube" -type d -name "bin" 2>/dev/null); do
            echo "$tool_bin" >> $GITHUB_PATH
          done

      - name: Run Clang-Tidy Static Analysis (User Code Only)
        run: |
          for board_dir in boards/*/; do
            board=$(basename "$board_dir")
            echo "=========================================="
            echo "Linting Board: $board (Debug)"
            echo "=========================================="
            just target=$board build_type=Debug lint
          done

  test:
    name: Renode Emulation Tests (STM32F401RE)
    needs: build
    runs-on: ubuntu-latest
    # Renode emulation is scoped to STM32F401RE (platform description stm32f4.repl is not available for G4)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download F401 Firmware Binary
        uses: actions/download-artifact@v4
        with:
          name: firmware-f401
          path: build/STM32F401RE-Debug

      - name: Cache Renode Installation
        id: cache-renode
        uses: actions/cache@v4
        with:
          path: ~/.renode
          key: renode-linux-portable-v1

      - name: Install Renode & Robot Framework
        run: |
          if [ ! -f "$HOME/.renode/renode-test" ]; then
            mkdir -p "$HOME/.renode"
            wget --progress=dot:giga https://builds.renode.io/renode-latest.linux-portable.tar.gz
            tar -xzf renode-latest.linux-portable.tar.gz -C "$HOME/.renode" --strip-components=1
            rm -f renode-latest.linux-portable.tar.gz
          fi
          echo "$HOME/.renode" >> $GITHUB_PATH
          pip install -r "$HOME/.renode/tests/requirements.txt"

      - name: Run Renode Emulation Tests
        run: |
          renode-test test/calculator.robot

      - name: Upload Renode Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-test-report
          path: |
            report.html
            log.html
            robot_output.xml
