name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renode-test:
    name: Renode Emulation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Cache STM32Cube Toolchain Bundles
        id: cache-stm32cube
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/stm32cube
            ~/.stm32cube
            ~/.local/share/stm32cube
          key: stm32cube-bundles-${{ runner.os }}-${{ hashFiles('.settings/bundles-lock.store.json') }}
          restore-keys: |
            stm32cube-bundles-${{ runner.os }}-

      - name: Install STM32CubeCLI and Toolchain Bundles
        run: |
          curl -fsSL https://developer.st.com/bundles/install/install.sh | bash -
          export PATH="$HOME/.local/stm32cube/bin:$PATH"
          echo "$HOME/.local/stm32cube/bin" >> $GITHUB_PATH

          cube bundle install --project --yes

          # Dynamically export discovered toolchain paths (no hardcoded versions)
          for tool_bin in $(find "$HOME/.local/stm32cube" "$HOME/.stm32cube" "$HOME/.local/share/stm32cube" -type d -name "bin" 2>/dev/null); do
            echo "$tool_bin" >> $GITHUB_PATH
          done

      - name: Build Target Firmware (STM32F401RE Debug)
        run: |
          just target=f401 build_type=Debug build

      - name: Install Renode & Robot Framework
        run: |
          wget --progress=dot:giga https://builds.renode.io/renode-latest.linux-portable.tar.gz
          mkdir -p "$HOME/renode" && tar -xzf renode-latest.linux-portable.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> $GITHUB_PATH
          python3 -m pip install -r "$HOME/renode/tests/requirements.txt"

      - name: Run Renode Emulation Tests
        run: |
          renode-test test/calculator.robot

      - name: Upload Renode Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-test-report
          path: |
            report.html
            log.html
            robot_output.xml
